# Job bot config. Edit freely.
#
# To add or fix a company, paste its careers page URL from your browser.
# The bot figures out the type from the URL:
#   Greenhouse  boards.greenhouse.io/<slug>  or  job-boards.greenhouse.io/<slug>
#   Lever       jobs.lever.co/<slug>
#   Ashby       jobs.ashbyhq.com/<slug>
#   Workday     <tenant>.wd<N>.myworkdayjobs.com/<site>
# Anything else is listed in the email under "Check by hand" with its link.
#
# Run `python jobbot.py --check` after editing to see which boards work.


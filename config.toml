[usajobs]
# Federal jobs (NIWC Pacific, Navy, DCAA, etc). Needs a free key from
# https://developer.usajobs.gov/apirequest/  Leave enabled; it skips itself if no key.
enabled = true
keywords = ["financial", "budget", "analyst", "contract specialist", "auditor", "economist"]
max_grade = 9   # GS-5/7/9 = entry level


[filters]
include_la_oc = false
allow_remote = true

locations = [
  "san diego", "poway", "carlsbad", "rancho bernardo", "sorrento valley",
  "la jolla", "kearny mesa", "chula vista", "el cajon", "oceanside",
  "escondido", "national city", "coronado", "san marcos", "vista, ca",
]
la_oc_locations = [
  "costa mesa", "irvine", "torrance", "el segundo", "los angeles",
  "long beach", "newport beach", "santa ana", "orange, ca", "aliso viejo",
  "hawthorne", "huntington beach", "anaheim",
]

# Title must hit at least one of these
title_include = [
  "analyst", "associate", "fp&a", "finance", "financial", "investment",
  "valuation", "research", "pricing", "cost", "contracts", "treasury",
  "corporate development", "business development", "capital markets",
  "budget", "auditor", "economist",
]

# Title is dropped if it hits any of these
title_exclude = [
  "senior", "sr", "principal", "staff", "lead", "manager", "director",
  "vp", "vice president", "head of", "chief", "ii", "iii", "iv", "v",
  "engineer", "engineering", "technician", "scientist", "software",
  "developer", "intern", "internship", "co-op", "machinist", "mechanic",
  "warehouse", "production", "assembly", "sales associate", "retail",
  "payroll", "accounts payable", "accounts receivable", "coordinator",
  "administrative", "assistant", "data entry", "cybersecurity", "it",
  "help desk", "nurse", "clinical",
]

max_years_required = 2   # drop if posting asks for more than this


[scoring]
finance_title = ["financial analyst", "fp&a", "investment", "valuation",
  "equity research", "investment banking", "corporate development",
  "private equity", "venture", "treasury", "pricing analyst", "cost analyst",
  "budget analyst", "capital markets", "m&a", "financial planning"]
entry_terms = ["entry level", "entry-level", "new grad", "new graduate",
  "recent graduate", "early career", "analyst i", "0-2 years", "0 - 2 years",
  "1-2 years", "0-1 years", "campus", "rotational"]
background_terms = ["dod", "department of defense", "defense", "aerospace",
  "a&d", "national security", "dcf", "valuation", "financial model",
  "modeling", "earned value", "eac", "estimate at completion", "proposal pricing",
  "government contracts", "far", "dfars", "m&a"]
